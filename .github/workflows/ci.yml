name: CI — Lint, Typecheck & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM:  ${{ secrets.TURBO_TEAM }}

jobs:
  # ── Lint & Typecheck ─────────────────────────────────────
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Credential leak check
        run: node scripts/check_no_credentials.mjs

  # ── Database Migration Check ─────────────────────────────
  migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: jscraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy migrations to clean database
        run: |
          DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/jscraft_test?schema=public" npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
        env:
          DB_USER: postgres
          DB_PASSWORD: ci_password

      - name: Verify schema matches migrations
        run: |
          DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/jscraft_test?schema=public" npx prisma migrate diff --from-migrations apps/api/prisma/migrations --to-schema-datamodel apps/api/prisma/schema.prisma --shadow-database-url "postgresql://${DB_USER}:${DB_PASSWORD}@localhost:5432/jscraft_shadow?schema=public" --exit-code
        env:
          DB_USER: postgres
          DB_PASSWORD: ci_password

  # ── Build ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL:        postgresql://localhost:5432/jscraft_test
      JWT_ACCESS_SECRET:   test-secret-minimum-32-characters-long-xxxxxxx
      JWT_REFRESH_SECRET:  test-refresh-minimum-32-characters-long-xxxxxx
      FRONTEND_URL:        http://localhost:5173
      VITE_API_URL:        /v1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ── Deploy preview (Vercel) ────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (Preview)
        run: echo "Vercel deployment handled by Vercel GitHub integration"
